<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7bc950">
<title>Harvest Hero Farm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div class="pill" id="wheatPill">🌾 <span id="wheat">0</span></div>
  <div class="pill" id="coinPill">🪙 <span id="coins">0</span></div>
  <div class="pill" id="timePill">⏱ <span id="time">0:00</span></div>
  <button id="soundBtn" class="pill btn" aria-label="Sound">🔊</button>
  <button id="quitBtn" class="pill btn" aria-label="End round">⏹</button>
</div>
<div id="goalBar" class="hidden"><div id="goalFill"></div><span id="goalText"></span></div>
<div id="hint" class="hidden"><div class="hand">👆</div><div>DRAG TO MOVE</div></div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>🌾 Harvest Hero Farm 🌾</h1>
    <p>Walk through wheat to harvest it, chop trees to open new fields, and sell at the market!</p>
    <button class="big" id="goalBtn">🎯 Goal Mode<small>Earn 500 coins fast!</small></button>
    <button class="big alt" id="endlessBtn">♾️ Endless Mode<small>Best: <span id="bestEndless">0</span> coins in 3 minutes</small></button>
    <p class="best">Fastest goal: <span id="bestGoal">—</span></p>
  </div>
  <footer>100% free · no ads · no purchases · made for kids &amp; families</footer>
</div>

<div id="endScreen" class="screen hidden">
  <div class="card">
    <h1 id="endTitle">Great job!</h1>
    <div id="stars"></div>
    <p id="endText"></p>
    <button class="big" id="replayBtn">🔁 Play Again</button>
    <button class="big alt" id="menuBtn">🏠 Menu</button>
  </div>
</div>

<script src="game.js?v=2"></script>
</body>
</html>
